aid: recyda
name: Recyda
description: >-
  Recyda is a German software company offering an all-in-one platform for
  packaging sustainability and regulatory compliance. The platform centralizes
  packaging data, automates Extended Producer Responsibility (EPR) fee
  calculation and declaration across 20+ countries, and assesses packaging
  recyclability against standards such as the ZSVR Minimum Standard and EN
  18120. It supports EU Packaging and Packaging Waste Regulation (PPWR)
  compliance, portfolio-wide assessments, and submission-ready reporting,
  turning weeks of manual compliance work into minutes. Recyda is trusted by
  global brands and is backed by venture firm Speedinvest.
